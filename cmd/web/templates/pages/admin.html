{{define "page_content"}}
<div class="max-w-4xl mx-auto animate-fade-in">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-zinc-800 dark:text-zinc-100">Administração</h1>
        <p class="text-zinc-500 dark:text-zinc-500 mt-1 text-sm">Gerenciar usuários do bolão</p>
    </div>

    {{if .Flash}}
    <div class="bg-green-50/60 dark:bg-green-950/30 border border-green-200/60 dark:border-green-800/30 text-green-700 dark:text-green-300 px-4 py-3 mb-4 text-sm rounded-2xl animate-fade-in">
        {{.Flash}}
    </div>
    {{end}}

    <div class="card rounded-2xl overflow-hidden animate-fade-in animate-fade-in-d1">
        <div class="px-5 py-3 border-b border-zinc-200/50 dark:border-zinc-800/30 bg-zinc-100/30 dark:bg-zinc-800/20">
            <h2 class="text-sm font-semibold text-zinc-700 dark:text-zinc-300">Usuários</h2>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-zinc-100/30 dark:bg-zinc-800/20 text-left text-xs text-zinc-500 dark:text-zinc-500">
                        <th class="px-5 py-3 font-semibold">Nome</th>
                        <th class="px-5 py-3 font-semibold">Pontos</th>
                        <th class="px-5 py-3 font-semibold">Ajuste</th>
                        <th class="px-5 py-3 font-semibold">Total</th>
                        <th class="px-5 py-3 text-right font-semibold">Ações</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-zinc-200/40 dark:divide-zinc-800/30">
                    {{range .Data}}
                    <tr class="hover:bg-zinc-50/50 dark:hover:bg-zinc-800/20 transition-colors">
                        <td class="px-5 py-3 font-medium text-zinc-700 dark:text-zinc-300">{{.Name}}</td>
                        <td class="px-5 py-3 text-zinc-500 dark:text-zinc-500">{{.Points}}</td>
                        <td class="px-5 py-3">
                            <form method="POST" action="/admin/update-points" class="flex items-center space-x-2">
                                <input type="hidden" name="user_id" value="{{.ID}}">
                                <input type="number" name="adjustment" value="{{.PointsAdjustment}}"
                                    class="w-20 bg-zinc-100/70 dark:bg-zinc-800/50 border border-zinc-200/60 dark:border-zinc-700/50 rounded-xl px-2.5 py-1.5 text-center text-sm focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-400 dark:focus:border-green-600 text-zinc-700 dark:text-zinc-300 transition-all">
                                <button type="submit" class="text-green-600 dark:text-green-400 hover:text-green-700 dark:hover:text-green-300 text-xs font-semibold transition-colors">
                                    Salvar
                                </button>
                            </form>
                        </td>
                        <td class="px-5 py-3 font-bold text-zinc-800 dark:text-zinc-200">{{.Total}}</td>
                        <td class="px-5 py-3 text-right">
                            <form method="POST" action="/admin/delete-user" onsubmit="return confirm('Excluir {{.Name}}? Esta ação não pode ser desfeita.')">
                                <input type="hidden" name="user_id" value="{{.ID}}">
                                <button type="submit" class="text-red-500 dark:text-red-400 hover:text-red-600 dark:hover:text-red-300 text-xs font-medium transition-colors">
                                    Excluir
                                </button>
                            </form>
                        </td>
                    </tr>
                    {{else}}
                    <tr>
                        <td colspan="5" class="px-5 py-8 text-center text-zinc-400 dark:text-zinc-600 text-sm">
                            Nenhum usuário encontrado
                        </td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
    </div>
</div>
{{end}}
