{{define "page_content"}}
<div class="animate-fade-in">
    <h1 class="text-2xl font-bold text-zinc-800 dark:text-zinc-100 mb-6">Ranking</h1>

    <div class="card-dashboard rounded-2xl p-5 mb-6 animate-fade-in animate-fade-in-d1">
        <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-zinc-700 dark:text-zinc-300 text-sm">Evolução dos Pontos</h3>
            <div class="flex items-center space-x-2">
                <button onclick="toggleChartType()" class="text-xs font-semibold text-zinc-500 dark:text-zinc-500 hover:text-green-600 dark:hover:text-green-400 transition-colors px-3 py-1.5 rounded-xl hover:bg-green-50/50 dark:hover:bg-green-950/20">
                    Alternar gráfico
                </button>
            </div>
        </div>
        <div class="chart-container" style="min-height: 300px;">
            <canvas id="rankingEvolutionChart"></canvas>
        </div>
    </div>

    <div class="card rounded-2xl overflow-hidden animate-fade-in animate-fade-in-d2" hx-get="/ranking/partial" hx-trigger="every 30s" hx-target="this" hx-swap="innerHTML">
        {{template "ranking_table" .}}
    </div>
</div>

<script>
var rankingChart = null;
var chartType = 'line';

function toggleChartType() {
    chartType = chartType === 'line' ? 'bar' : 'line';
    if (rankingChart) {
        rankingChart.destroy();
        rankingChart = null;
    }
    initRankingChart();
}

function initRankingChart() {
    fetch('/api/stats/ranking-evolution')
        .then(r => r.json())
        .then(data => {
            if (data.length === 0) return;
            const ctx = document.getElementById('rankingEvolutionChart').getContext('2d');
            const isDark = document.documentElement.classList.contains('dark');
            const textColor = isDark ? '#a1a1aa' : '#71717a';
            const gridColor = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';

            const colors = ['#22c55e', '#f97316', '#6366f1', '#ef4444', '#8b5cf6', '#14b8a6', '#f97316', '#ec4899'];

            if (chartType === 'line') {
                rankingChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data[0].data.map(d => d.label),
                        datasets: data.map((series, i) => ({
                            label: series.name,
                            data: series.data.map(d => d.points),
                            borderColor: colors[i % colors.length],
                            backgroundColor: colors[i % colors.length] + '20',
                            fill: false,
                            tension: 0.35,
                            pointRadius: 3,
                            pointHoverRadius: 6,
                            pointBackgroundColor: colors[i % colors.length],
                            pointBorderColor: isDark ? '#18181b' : '#ffffff',
                            pointBorderWidth: 2,
                            borderWidth: 2.5,
                        })),
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    color: textColor,
                                    boxWidth: 12,
                                    padding: 12,
                                    font: { size: 11 },
                                    usePointStyle: true,
                                },
                            },
                            tooltip: {
                                backgroundColor: isDark ? '#27272a' : '#ffffff',
                                titleColor: isDark ? '#e4e4e7' : '#3f3f46',
                                bodyColor: isDark ? '#a1a1aa' : '#71717a',
                                borderColor: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)',
                                borderWidth: 1,
                                padding: 10,
                                cornerRadius: 8,
                                boxPadding: 4,
                            },
                        },
                        scales: {
                            x: {
                                grid: { color: gridColor },
                                ticks: { color: textColor, font: { size: 10 } },
                            },
                            y: {
                                grid: { color: gridColor },
                                ticks: { color: textColor, font: { size: 10 } },
                                beginAtZero: true,
                            },
                        },
                    },
                });
            } else {
                const datasets = data.map((series, i) => ({
                    label: series.name,
                    data: series.data.map(d => d.points),
                    backgroundColor: colors[i % colors.length],
                    borderRadius: 4,
                    barPercentage: 0.7,
                }));

                rankingChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data[0].data.map(d => d.label),
                        datasets: datasets,
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: textColor, boxWidth: 12, padding: 12, font: { size: 11 }, usePointStyle: true },
                            },
                            tooltip: {
                                backgroundColor: isDark ? '#27272a' : '#ffffff',
                                titleColor: isDark ? '#e4e4e7' : '#3f3f46',
                                bodyColor: isDark ? '#a1a1aa' : '#71717a',
                                borderColor: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)',
                                borderWidth: 1,
                                padding: 10,
                                cornerRadius: 8,
                            },
                        },
                        scales: {
                            x: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } } },
                            y: { grid: { color: gridColor }, ticks: { color: textColor, font: { size: 9 } }, beginAtZero: true },
                        },
                    },
                });
            }
        });
}

document.addEventListener('DOMContentLoaded', function() {
    initRankingChart();
});
</script>
{{end}}
