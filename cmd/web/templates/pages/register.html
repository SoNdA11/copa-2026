{{define "page_content"}}
<div class="max-w-sm mx-auto mt-16 animate-fade-in">
    <div class="card rounded-2xl p-6">
        <h1 class="text-xl font-bold text-center text-stone-800 dark:text-stone-200 mb-6">Cadastro</h1>
        <form method="POST" action="/register" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-stone-500 dark:text-stone-500 mb-1.5">Nome de usuário</label>
                <input type="text" name="name" required
                    class="w-full bg-stone-100/70 dark:bg-stone-800/50 border border-stone-200/60 dark:border-stone-700/50 rounded-2xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-400/20 focus:border-emerald-400 dark:focus:border-emerald-600 text-stone-700 dark:text-stone-300 placeholder-stone-400 dark:placeholder-stone-600 text-sm transition-all">
            </div>
            <div>
                <label class="block text-xs font-semibold text-stone-500 dark:text-stone-500 mb-1.5">Senha</label>
                <div class="relative">
                    <input type="password" name="password" required minlength="4" id="reg-password"
                        class="w-full bg-stone-100/70 dark:bg-stone-800/50 border border-stone-200/60 dark:border-stone-700/50 rounded-2xl px-3 py-2.5 pr-11 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-400/20 focus:border-emerald-400 dark:focus:border-emerald-600 text-stone-700 dark:text-stone-300 placeholder-stone-400 dark:placeholder-stone-600 text-sm transition-all">
                    <button type="button" onclick="togglePassword('reg-password', this)"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 dark:text-stone-600 hover:text-stone-600 dark:hover:text-stone-400 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-stone-500 dark:text-stone-500 mb-1.5">Confirmar Senha</label>
                <div class="relative">
                    <input type="password" name="confirm_password" required id="reg-confirm"
                        class="w-full bg-stone-100/70 dark:bg-stone-800/50 border border-stone-200/60 dark:border-stone-700/50 rounded-2xl px-3 py-2.5 pr-11 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-400/20 focus:border-emerald-400 dark:focus:border-emerald-600 text-stone-700 dark:text-stone-300 placeholder-stone-400 dark:placeholder-stone-600 text-sm transition-all">
                    <button type="button" onclick="togglePassword('reg-confirm', this)"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 dark:text-stone-600 hover:text-stone-600 dark:hover:text-stone-400 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full btn-primary text-white dark:text-stone-900 font-semibold py-3 rounded-xl text-sm">
                Cadastrar
            </button>
        </form>
        <p class="text-center text-stone-500 dark:text-stone-500 text-sm mt-5">
            Já tem conta?
            <a href="/login" class="link font-semibold">Entrar</a>
        </p>
    </div>
</div>

<script>
function togglePassword(id, btn) {
    var input = document.getElementById(id);
    if (input.type === "password") {
        input.type = "text";
        btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>';
    } else {
        input.type = "password";
        btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>';
    }
}
</script>
{{end}}
