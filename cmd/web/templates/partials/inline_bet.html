{{define "inline_bet"}}
<div class="card rounded-2xl p-4 border-l-4 border-amber-400 dark:border-amber-500 bg-amber-50/40 dark:bg-amber-950/20 animate-fade-in">
    <form hx-post="/matches/{{.Data.ID}}/bet?inline=true" hx-target="closest .card" hx-swap="outerHTML" class="space-y-3">
        <div class="flex items-center justify-between px-2">
            <div class="flex items-center space-x-2 flex-1 min-w-0">
                {{if .Data.HomeTeam.FlagURL}}
                <img src="{{.Data.HomeTeam.FlagURL}}" alt="{{.Data.HomeTeam.Name}}" class="w-6 h-6 object-contain flex-shrink-0">
                {{else}}
                <div class="w-6 h-6 bg-stone-100 dark:bg-stone-800 rounded-lg flex items-center justify-center text-[10px] text-stone-500 dark:text-stone-500 font-semibold flex-shrink-0">{{slice .Data.HomeTeam.Name 0 3}}</div>
                {{end}}
                <span class="font-semibold text-stone-700 dark:text-stone-300 text-sm truncate">{{.Data.HomeTeam.Name}}</span>
            </div>
            <div class="flex items-center space-x-2 mx-3">
                <select name="home_score" class="bg-white dark:bg-stone-800 border border-stone-200/60 dark:border-stone-700/50 rounded-xl px-2 py-1.5 text-center text-base font-bold w-14 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-400/20 focus:border-emerald-400 dark:focus:border-emerald-600 text-stone-700 dark:text-stone-300 appearance-none cursor-pointer transition-all">
                    {{range seq 0 10}}
                    <option value="{{.}}" class="bg-white dark:bg-stone-900 text-stone-700 dark:text-stone-300" {{if $.Bet}}{{if eq $.Bet.HomeScore .}}selected{{end}}{{else if eq . 0}}selected{{end}}>{{.}}</option>
                    {{end}}
                </select>
                <span class="text-stone-300 dark:text-stone-700 font-bold text-lg">x</span>
                <select name="away_score" class="bg-white dark:bg-stone-800 border border-stone-200/60 dark:border-stone-700/50 rounded-xl px-2 py-1.5 text-center text-base font-bold w-14 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-400/20 focus:border-emerald-400 dark:focus:border-emerald-600 text-stone-700 dark:text-stone-300 appearance-none cursor-pointer transition-all">
                    {{range seq 0 10}}
                    <option value="{{.}}" class="bg-white dark:bg-stone-900 text-stone-700 dark:text-stone-300" {{if $.Bet}}{{if eq $.Bet.AwayScore .}}selected{{end}}{{else if eq . 0}}selected{{end}}>{{.}}</option>
                    {{end}}
                </select>
            </div>
            <div class="flex items-center space-x-2 flex-1 justify-end min-w-0">
                <span class="font-semibold text-stone-700 dark:text-stone-300 text-sm truncate">{{.Data.AwayTeam.Name}}</span>
                {{if .Data.AwayTeam.FlagURL}}
                <img src="{{.Data.AwayTeam.FlagURL}}" alt="{{.Data.AwayTeam.Name}}" class="w-6 h-6 object-contain flex-shrink-0">
                {{else}}
                <div class="w-6 h-6 bg-stone-100 dark:bg-stone-800 rounded-lg flex items-center justify-center text-[10px] text-stone-500 dark:text-stone-500 font-semibold flex-shrink-0">{{slice .Data.AwayTeam.Name 0 3}}</div>
                {{end}}
            </div>
        </div>
        <div class="flex items-center justify-center space-x-3 pt-1">
            <button type="submit" class="btn-primary text-white dark:text-stone-900 font-bold px-6 py-2 rounded-xl text-xs transition-all hover:scale-105">
                {{if .Bet}}Atualizar{{else}}Confirmar{{end}}
            </button>
            <button type="button"
                hx-get="/matches/{{.Data.ID}}/inline-bet?cancel=true"
                hx-target="closest .card"
                hx-swap="outerHTML"
                class="text-stone-400 dark:text-stone-600 hover:text-stone-600 dark:hover:text-stone-400 font-semibold text-xs px-4 py-2 rounded-xl hover:bg-stone-100/50 dark:hover:bg-stone-800/30 transition-all">
                Cancelar
            </button>
        </div>
    </form>
</div>
{{end}}
