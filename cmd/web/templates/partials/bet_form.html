{{define "bet_form"}}
<form hx-post="/matches/{{.Data.ID}}/bet" hx-target="this" hx-swap="outerHTML" class="space-y-4">
    {{if .Flash}}
    <div class="bg-green-50/60 dark:bg-green-950/30 border border-green-200/60 dark:border-green-800/30 text-green-700 dark:text-green-300 px-4 py-3 rounded-2xl text-sm text-center font-medium animate-fade-in">
        {{.Flash}}
    </div>
    {{end}}
    <p class="text-sm font-semibold text-zinc-500 dark:text-zinc-500 text-center">Seu palpite</p>
    <div class="flex items-center justify-center space-x-5">
        <div class="text-center">
            <p class="text-xs font-medium text-zinc-400 dark:text-zinc-600 mb-2">{{.Data.HomeTeam.Name}}</p>
            <select name="home_score" class="bg-zinc-100/70 dark:bg-zinc-800/50 border border-zinc-200/60 dark:border-zinc-700/50 rounded-2xl px-4 py-2.5 text-center text-lg font-bold w-22 focus:outline-none focus:ring-2 focus:ring-green-500/20 dark:focus:ring-green-400/20 focus:border-green-400 dark:focus:border-green-600 text-zinc-700 dark:text-zinc-300 appearance-none cursor-pointer transition-all">
                {{range seq 0 10}}
                <option value="{{.}}" class="bg-white dark:bg-zinc-900 text-zinc-700 dark:text-zinc-300" {{if $.Bet}}{{if eq $.Bet.HomeScore .}}selected{{end}}{{end}}>{{.}}</option>
                {{end}}
            </select>
        </div>
        <span class="text-zinc-300 dark:text-zinc-700 font-bold text-2xl mt-8">x</span>
        <div class="text-center">
            <p class="text-xs font-medium text-zinc-400 dark:text-zinc-600 mb-2">{{.Data.AwayTeam.Name}}</p>
            <select name="away_score" class="bg-zinc-100/70 dark:bg-zinc-800/50 border border-zinc-200/60 dark:border-zinc-700/50 rounded-2xl px-4 py-2.5 text-center text-lg font-bold w-22 focus:outline-none focus:ring-2 focus:ring-green-500/20 dark:focus:ring-green-400/20 focus:border-green-400 dark:focus:border-green-600 text-zinc-700 dark:text-zinc-300 appearance-none cursor-pointer transition-all">
                {{range seq 0 10}}
                <option value="{{.}}" class="bg-white dark:bg-zinc-900 text-zinc-700 dark:text-zinc-300" {{if $.Bet}}{{if eq $.Bet.AwayScore .}}selected{{end}}{{end}}>{{.}}</option>
                {{end}}
            </select>
        </div>
    </div>
    {{if .Data.IsKnockout}}
    <div class="flex items-center justify-center space-x-6 pt-1 pb-2">
        <span class="text-xs font-medium text-zinc-400">Em caso de empate, quem avança:</span>
        <label class="flex items-center space-x-1.5 cursor-pointer">
            <input type="radio" name="advancing_team_id" value="{{.Data.HomeTeam.ID}}"
                class="w-4 h-4 text-green-500 focus:ring-green-500/20 cursor-pointer"
                {{if $.Bet}}{{if eq $.Bet.AdvancingTeamID .Data.HomeTeam.ID}}checked{{end}}{{else}}checked{{end}}>
            <span class="text-sm text-zinc-600 dark:text-zinc-400">{{.Data.HomeTeam.Name}}</span>
        </label>
        <label class="flex items-center space-x-1.5 cursor-pointer">
            <input type="radio" name="advancing_team_id" value="{{.Data.AwayTeam.ID}}"
                class="w-4 h-4 text-green-500 focus:ring-green-500/20 cursor-pointer"
                {{if $.Bet}}{{if eq $.Bet.AdvancingTeamID .Data.AwayTeam.ID}}checked{{end}}{{end}}>
            <span class="text-sm text-zinc-600 dark:text-zinc-400">{{.Data.AwayTeam.Name}}</span>
        </label>
    </div>
    {{end}}
    <div class="text-center pt-2">
        <button type="submit" class="btn-primary font-bold px-10 py-3 rounded-xl text-sm">
            {{if .Bet}}Atualizar palpite{{else}}Enviar palpite{{end}}
        </button>
    </div>
</form>
{{end}}
