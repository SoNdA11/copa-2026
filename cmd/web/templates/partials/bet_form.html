{{define "bet_form"}}
<form hx-post="/matches/{{.Data.ID}}/bet" hx-target="this" hx-swap="outerHTML" class="space-y-4">
    {{if .Flash}}
    <div class="bg-emerald-50/60 dark:bg-emerald-950/30 border border-emerald-200/60 dark:border-emerald-800/30 text-emerald-700 dark:text-emerald-300 px-4 py-3 rounded-2xl text-sm text-center font-medium animate-fade-in">
        {{.Flash}}
    </div>
    {{end}}
    <p class="text-sm font-semibold text-stone-500 dark:text-stone-500 text-center">Seu palpite</p>
    <div class="flex items-center justify-center space-x-5">
        <div class="text-center">
            <p class="text-xs font-medium text-stone-400 dark:text-stone-600 mb-2">{{.Data.HomeTeam.Name}}</p>
            <select name="home_score" class="bg-stone-100/70 dark:bg-stone-800/50 border border-stone-200/60 dark:border-stone-700/50 rounded-2xl px-4 py-2.5 text-center text-lg font-bold w-22 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-400/20 focus:border-emerald-400 dark:focus:border-emerald-600 text-stone-700 dark:text-stone-300 appearance-none cursor-pointer transition-all">
                {{range seq 0 10}}
                <option value="{{.}}" class="bg-white dark:bg-stone-900 text-stone-700 dark:text-stone-300" {{if $.Bet}}{{if eq $.Bet.HomeScore .}}selected{{end}}{{end}}>{{.}}</option>
                {{end}}
            </select>
        </div>
        <span class="text-stone-300 dark:text-stone-700 font-bold text-2xl mt-8">x</span>
        <div class="text-center">
            <p class="text-xs font-medium text-stone-400 dark:text-stone-600 mb-2">{{.Data.AwayTeam.Name}}</p>
            <select name="away_score" class="bg-stone-100/70 dark:bg-stone-800/50 border border-stone-200/60 dark:border-stone-700/50 rounded-2xl px-4 py-2.5 text-center text-lg font-bold w-22 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:focus:ring-emerald-400/20 focus:border-emerald-400 dark:focus:border-emerald-600 text-stone-700 dark:text-stone-300 appearance-none cursor-pointer transition-all">
                {{range seq 0 10}}
                <option value="{{.}}" class="bg-white dark:bg-stone-900 text-stone-700 dark:text-stone-300" {{if $.Bet}}{{if eq $.Bet.AwayScore .}}selected{{end}}{{end}}>{{.}}</option>
                {{end}}
            </select>
        </div>
    </div>
    <div class="text-center pt-2">
        <button type="submit" class="btn-primary font-bold px-10 py-3 rounded-xl text-sm">
            {{if .Bet}}Atualizar palpite{{else}}Enviar palpite{{end}}
        </button>
    </div>
</form>
{{end}}
